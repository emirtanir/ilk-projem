<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ürünler · Lidya Kuyumculuk</title>
  <link rel="icon" href="logo/lidya-logo-yuvarlak.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/stil.css">
</head>
<body>
  <div id="ust"></div>

  <main class="kap">
    <div class="sayfa-basi">
      <span class="kucuk-baslik" id="liste-ust-baslik">Koleksiyon</span>
      <h1 id="liste-baslik">Tüm Ürünler</h1>
      <p id="liste-aciklama" hidden></p>
    </div>

    <div class="liste-duzen">
      <div class="liste-ust">
        <span class="sonuc" id="sonuc-sayisi"></span>
        <div class="liste-araclar">
          <label class="sirala"><span>Sırala</span>
            <select id="sirala">
              <option value="">Önerilen</option>
              <option value="artan">Fiyat: düşükten yükseğe</option>
              <option value="azalan">Fiyat: yüksekten düşüğe</option>
              <option value="yeni">En yeniler</option>
            </select>
          </label>
          <button class="dugme dugme-cizgi filtre-dugme" id="filtre-dugme">Filtrele</button>
        </div>
      </div>
      <aside class="filtreler" id="filtreler"></aside>
      <div class="urun-izgara" id="urun-izgara"></div>
    </div>
  </main>

  <div id="alt"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/fiyat.js"></script>
  <script src="js/urunler.js"></script>
  <script src="js/iletisim.js"></script>
  <script src="js/ortak.js"></script>
  <script src="js/liste.js"></script>
</body>
</html>
