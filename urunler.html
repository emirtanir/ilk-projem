<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ürünler · Lidya Kuyumculuk</title>
  <link rel="icon" href="logo/lidya-logo-yuvarlak.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/stil.css?v=20261031-030510">
</head>
<body>
  <div id="ust"></div>

  <main class="kap">
    <div class="sayfa-basi">
      <span class="kucuk-baslik" id="liste-ust-baslik">Koleksiyon</span>
      <h1 id="liste-baslik">Tüm Ürünler</h1>
      <p id="liste-aciklama" hidden></p>
    </div>

    <div class="liste-duzen">
      <!-- Filtrele ve Sırala: bilgisayarda listenin üstünde yan yana, telefonda iki eşit buton + alttan açılan panel -->
      <div class="liste-araclar" id="liste-araclar">
        <div class="arac">
          <button class="arac-dugme" type="button" data-panel="filtre-panel" aria-expanded="false" aria-haspopup="true">
            <span class="arac-ikon" id="filtre-ikon"></span><span>Filtrele<small id="filtre-ozet">Tümü</small></span>
          </button>
          <div class="alt-panel alt-panel-genis" id="filtre-panel" hidden>
            <div class="alt-panel-ic" role="dialog" aria-label="Filtrele">
              <div class="alt-panel-bas"><strong>Filtrele</strong><button type="button" class="panel-kapat" data-panel-kapat aria-label="Kapat">×</button></div>
              <div class="filtreler" id="filtreler"></div>
              <div class="alt-panel-alt">
                <button type="button" class="filtre-temizle" data-temizle>Filtreleri temizle</button>
                <button type="button" class="dugme" data-panel-kapat id="sonuclari-goster">Sonuçları göster</button>
              </div>
            </div>
          </div>
        </div>
        <div id="sirala-arac"></div>
      </div>
      <p class="sonuc" id="sonuc-sayisi"></p>
      <div class="urun-izgara" id="urun-izgara"></div>
    </div>
  </main>

  <div id="alt"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js?v=20261031-030510"></script>
  <script src="js/fiyat.js?v=20261031-030510"></script>
  <script src="js/urunler.js?v=20261031-030510"></script>
  <script src="js/iletisim.js?v=20261031-030510"></script>
  <script src="js/ortak.js?v=20261031-030510"></script>
  <script src="js/liste.js?v=20261031-030510"></script>
</body>
</html>
